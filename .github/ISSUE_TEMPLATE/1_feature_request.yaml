name: "Feature request"
description: "Suggest an idea or mechanic to add or remove from the server"
title: "[Feature] Cheese burgers"
labels: ["feature"]
assignees: ["McSnurtle"]
projects: ["McSnurtle/1"]

body:
  - type: markdown
    id: warning
    attributes:
      value: |
        **Before submitting this feature request:** ensure that this idea has not been submitted already.
  - type: textarea
    id: description
    attributes:
      label: "Describe the feature"
      description: |
        A clear and concise description of what you would like to see added / removed and why.
      placeholder: |
        Cheese burgers would be edible items, craftable and able to be automated, found occasionally in village chests and sold by farmers.
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: "What problems does this feature solve / cause?"
      description: |
        Describe the problems the feature would solve, or cause for the player.
      placeholder: |
        Solves the issue of not finding enough food from Farmer's Delight in village chests.
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: "How does this tie into existing systems?"
      description: |
        What gameplay / systems would obviously require changing to implement / remove this feature?
      placeholder: "Villages, loot tables, food system / farmers delight"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: |
        Attach screenshots or additional details to demonstrate your feature.
      placeholder: "Beesechurger"
    validations:
      required: false
